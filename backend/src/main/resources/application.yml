server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: breachers-backend
  datasource:
    url: jdbc:h2:mem:breachersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always

app:
  version: 0.1.0
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"

logging:
  level:
    root: INFO
    io.breachers: DEBUG
