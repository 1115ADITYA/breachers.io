server:
  port: ${PORT:8081}

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/breachersdb}}}
    driverClassName: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io.breachers: ${LOG_LEVEL_APP:INFO}
